[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "romo-gs-reproduction"
version = "0.1.0"
description = "Independent exposure-integrated Gaussian splatting core and Mac pilot"
requires-python = ">=3.12"
dependencies = ["torch==2.15.0", "numpy==2.5.4", "scipy==1.18.1", "matplotlib==3.11.2", "pillow", "pytest"]

[tool.setuptools.packages.find]
include = ["romo_gs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
